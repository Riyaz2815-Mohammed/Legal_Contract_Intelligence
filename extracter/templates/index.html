<!DOCTYPE html>
<html>
<head>
    <title>PDF Text Extractor</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            text-align: center;
        }

        .container {
            width: 60%;
            margin: auto;
            background: white;
            padding: 20px;
            margin-top: 50px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        textarea {
            width: 100%;
            height: 300px;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
        }

        input {
            margin: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Upload PDF to Extract Text</h2>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="pdf_file" accept=".pdf" required>
        <br>
        <button type="submit">Extract Text</button>
    </form>
     
    {% if text %}
        <h3>Extracted Text:</h3>
        <textarea readonly>{{ text }}</textarea>
    {% endif %}

</div>

</body>
</html>
